{% extends "authenticated-base.html" %}
{% block title %}Administrator Dashboard{% endblock %}

{% block subpage_content %}
<div class="container-fluid py-2">
  <h1 class="h4 mb-2">Administrator Dashboard</h1>
  <div class="card border-0 shadow-sm mt-3">
    <div class="card-body p-4">
      <h2 class="h5 mb-2">Application Matching</h2>
      <p class="text-secondary">Evaluate submitted applications against internship requirements and available positions.</p>
      <form method="post" action="{{ url_for('admin_matching_action') }}">
        <button class="btn btn-primary" type="submit">Initiate Matching</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
